<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Protocol Converter</title>
<style>*{box-sizing:border-box;margin:0;padding:0}body{font:13px/1.5 'Microsoft YaHei','Segoe UI',sans-serif;background:#f0f2f5;color:#2c3e50}.topbar{background:#1a1a2e;color:#e0e0e0;padding:0 16px;display:flex;align-items:center;height:44px}.topbar h1{font-size:15px;margin-right:20px;color:#fff}.nav{display:flex;gap:1px}.nav a{color:#a0aec0;text-decoration:none;padding:6px 16px;border-radius:6px 6px 0 0;font-size:12.5px}.nav a:hover,.nav a.active{color:#fff;background:rgba(255,255,255,.12);font-weight:600}.spacer{flex:1}.proto-sel select{padding:3px 8px;border-radius:4px;border:1px solid #3d4f6b;font-size:11.5px;background:#2a3a55;color:#e0e0e0}.main{padding:12px 16px;max-width:1500px;margin:0 auto;display:grid;grid-template-columns:280px 1fr;gap:10px}@media(max-width:900px){.main{grid-template-columns:1fr}}.card{background:#fff;border-radius:8px;padding:14px;box-shadow:0 1px 3px rgba(0,0,0,.06);border:1px solid #e8eaed;margin-bottom:0}.card h2{font-size:14px;font-weight:600;color:#1a1a2e;margin-bottom:8px}table{width:100%;border-collapse:collapse;font-size:12.5px}th{background:#f5f6f8;padding:7px 10px;border-bottom:2px solid #e0e3e8;font-weight:600;color:#555;white-space:nowrap;font-size:12px;text-align:left}td{padding:6px 10px;border-bottom:1px solid #f2f3f5;font-size:12.5px}tr:hover td{background:#f8f9ff}input,select,button{font-family:inherit;font-size:12.5px}input{outline:0;border:1px solid #d0d5dd;border-radius:5px;padding:6px 10px}input:focus{border-color:#4a90d9;box-shadow:0 0 0 3px rgba(74,144,217,.1)}button{cursor:pointer;font-weight:600;border:0;border-radius:5px;padding:6px 16px;font-size:12.5px}.btn-primary{background:#4a90d9;color:#fff}.btn-primary:hover{background:#357ac0}.btn-success{background:#34a853;color:#fff}.btn-sm{padding:4px 10px;font-size:11.5px}.tag{display:inline-block;padding:1px 7px;border-radius:10px;font-size:11px;margin:1px 2px}.tag-blue{background:#e8f0fe;color:#1967d2}.tag-green{background:#e6f4ea;color:#137333}.tag-orange{background:#fef7e0;color:#b06000}.badge{display:inline-block;padding:0 6px;border-radius:8px;font-size:10px;background:#e0e3e8;color:#666;margin-left:4px}.mono{font-family:'Cascadia Code',Consolas,monospace;font-size:12px}.scroll-box{overflow:auto;max-height:calc(100vh - 140px)}.tree-item{cursor:pointer;padding:3px 0}.tree-item .toggle{font-size:10px;color:#888;margin-right:3px;display:inline-block;width:14px;text-align:center}.stage-name{font-weight:600;color:#1a1a2e;font-size:13px}.msg-row{display:flex;align-items:center;padding:3px 8px 3px 20px;cursor:pointer;border-radius:4px;font-size:12px;color:#555;transition:.1s}.msg-row:hover{background:#e8f0fe;color:#1967d2}.msg-row .mabbr{font-weight:600;font-family:Consolas,monospace;font-size:11.5px;width:55px}.msg-row .mname{flex:1}.msg-row .mpf{font-size:10px;color:#999;font-family:Consolas,monospace}.stage-group{margin-bottom:2px}.stage-children{display:none;margin-left:6px;border-left:2px solid #e8eaed;padding-left:6px}.stage-children.open{display:block}.detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:5px 16px}.detail-item{font-size:12.5px}.detail-item .lbl{color:#888;font-size:11px}.detail-item .val{font-weight:600}.search-box{display:flex;gap:6px;margin-bottom:8px}.search-box input{flex:1;max-width:300px}.search-result{cursor:pointer}.search-result:hover td{background:#e8f0fe}.nav-right{display:flex;gap:6px}</style></head><body>
<div class="topbar"><h1>Protocol Converter</h1><div class="nav"><a href="/query" class="active">协议查询</a><a href="/decode">帧解码</a><a href="/encode">帧编码</a><a href="/parse">批量解析</a></div><div class="spacer"></div><div class="proto-sel"><select id="proto-sel" onchange="switchProto(this.value)"></select></div></div>
<div class="main">
  <div class="card" id="tree-card"><h2>消息树</h2><div class="scroll-box" id="tree">加载中...</div></div>
  <div>
    <div class="card" id="detail-card" style="display:none">
      <h2 id="detail-title">报文详情</h2>
      <div class="detail-grid" id="detail-grid"></div>
      <div style="margin-top:8px"><button class="btn-primary btn-sm" id="btn-encode" onclick="goEncode()">编码此报文</button></div>
    </div>
    <div class="card"><h2>搜索</h2><div class="search-box"><input id="kw" placeholder="报文缩写/名称/SPN..." onkeyup="if(event.key==='Enter')search()"><button class="btn-primary btn-sm" onclick="search()">搜索</button></div><div class="scroll-box" id="search-res" style="max-height:300px"></div></div>
  </div>
</div>
<script>
const P={{protocols|tojson}},CID="{{current_id}}";
(function(){const s=document.getElementById('proto-sel');for(const[k,v]of Object.entries(P)){const o=document.createElement('option');o.value=k;o.text=v;if(k===CID)o.selected=true;s.appendChild(o)}})();
async function switchProto(id){await fetch('/api/protocol/select',{method:'POST',body:new URLSearchParams({protocol_id:id})});location.reload()}
let curMsg=null;
async function loadTree(){const r=await fetch('/api/messages/tree'),stages=await r.json();const el=document.getElementById('tree');el.innerHTML='';stages.forEach(s=>{const g=document.createElement('div');g.className='stage-group';g.innerHTML='<div class="tree-item"><span class="toggle">&#9654;</span><span class="stage-name">'+s.name+'</span><span class="badge">'+s.messages.length+'</span></div><div class="stage-children" id="sc-'+s.name+'"></div>';const ch=g.querySelector('.stage-children');s.messages.forEach(m=>{const r=document.createElement('div');r.className='msg-row';r.innerHTML='<span class="mabbr">'+m.abbr+'</span><span class="mname">'+m.name+'</span><span class="mpf">0x'+(m.pf?m.pf.toString(16):'-')+'</span>';r.onclick=(e)=>{e.stopPropagation();showDetail(m)};ch.appendChild(r)});const h=g.querySelector('.tree-item');h.onclick=()=>{ch.classList.toggle('open');h.querySelector('.toggle').innerHTML=ch.classList.contains('open')?'&#9660;':'&#9654;'};el.appendChild(g)})}
async function showDetail(m){const r=await fetch('/api/messages?keyword='+m.abbr),msgs=await r.json();if(!msgs.length)return;const msg=msgs[0];curMsg=msg;const d=document.getElementById('detail-card');d.style.display='';document.getElementById('detail-title').textContent=msg.abbr+' \u2014 '+msg.name;document.getElementById('detail-grid').innerHTML='<div class="detail-item"><div class="lbl">方向</div><div class="val">'+msg.direction+'</div></div><div class="detail-item"><div class="lbl">阶段</div><div class="val">'+msg.stage+'</div></div><div class="detail-item"><div class="lbl">PF</div><div class="val mono">0x'+(msg.pf?msg.pf.toString(16):'-')+' ('+msg.pf+')</div></div><div class="detail-item"><div class="lbl">数据长度</div><div class="val">'+msg.data_length+' bytes'+(msg.tp?' <span class="tag tag-orange">TP</span>':'')+'</div></div>';document.getElementById('btn-encode').style.display=''}
async function search(){const kw=document.getElementById('kw').value.trim();if(!kw)return;const r=await fetch('/api/messages?keyword='+kw),msgs=await r.json();const el=document.getElementById('search-res');el.innerHTML=msgs.length?'<table><tr><th>缩写</th><th>名称</th><th>阶段</th><th>PF</th><th>方向</th><th>长度</th></tr>'+msgs.map(m=>'<tr class="search-result" onclick="showDetail({abbr:\''+m.abbr+'\',pf:'+m.pf+'})"><td class="mono">'+m.abbr+'</td><td>'+m.name+'</td><td>'+m.stage+'</td><td class="mono">0x'+(m.pf?m.pf.toString(16):'')+'</td><td>'+m.direction+'</td><td>'+m.data_length+'</td></tr>').join('')+'</table>':'<div style="color:#999;padding:16px;text-align:center">无匹配结果</div>'}
function goEncode(){if(curMsg)location.href='/encode?msg='+curMsg.abbr}
loadTree();
</script></body></html>
