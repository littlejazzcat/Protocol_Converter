<!DOCTYPE html><html lang="zh"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>批量解析 - Protocol Converter</title>
<style>*{box-sizing:border-box;margin:0;padding:0}body{font:13px/1.5 'Microsoft YaHei','Segoe UI',sans-serif;background:#f0f2f5;color:#2c3e50}.topbar{background:#1a1a2e;color:#e0e0e0;padding:0 16px;display:flex;align-items:center;height:44px}.topbar h1{font-size:15px;margin-right:20px;color:#fff}.nav{display:flex;gap:1px}.nav a{color:#a0aec0;text-decoration:none;padding:6px 16px;border-radius:6px 6px 0 0;font-size:12.5px}.nav a:hover,.nav a.active{color:#fff;background:rgba(255,255,255,.12);font-weight:600}.spacer{flex:1}.proto-sel select{padding:3px 8px;border-radius:4px;border:1px solid #3d4f6b;font-size:11.5px;background:#2a3a55;color:#e0e0e0}.main{padding:12px 16px;max-width:1500px;margin:0 auto}.card{background:#fff;border-radius:8px;padding:14px;box-shadow:0 1px 3px rgba(0,0,0,.06);border:1px solid #e8eaed;margin-bottom:10px}.card h2{font-size:14px;font-weight:600;color:#1a1a2e;margin-bottom:8px}table{width:100%;border-collapse:collapse;font-size:12.5px}th{background:#f5f6f8;padding:7px 10px;border-bottom:2px solid #e0e3e8;font-weight:600;color:#555;white-space:nowrap;font-size:12px;text-align:left}td{padding:6px 10px;border-bottom:1px solid #f2f3f5}tr:hover td{background:#f8f9ff}input,button{font-family:inherit;font-size:12.5px}input{border:1px solid #d0d5dd;border-radius:5px;padding:6px 10px;outline:0}button{cursor:pointer;font-weight:600;border:0;border-radius:5px;padding:6px 16px}.btn-primary{background:#4a90d9;color:#fff}.btn-primary:hover{background:#357ac0}.btn-success{background:#34a853;color:#fff}.btn-success:hover{background:#2d8f47}.btn-sm{padding:4px 10px;font-size:11.5px}.row-inline{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:8px}.tag{display:inline-block;padding:1px 7px;border-radius:10px;font-size:11px;margin:1px 2px}.tag-green{background:#e6f4ea;color:#137333}.tag-red{background:#fce8e6;color:#c5221f}.tag-orange{background:#fef7e0;color:#b06000}.tag-blue{background:#e8f0fe;color:#1967d2}.mono{font-family:'Cascadia Code',Consolas,monospace;font-size:12px}.scroll-box{overflow:auto;max-height:380px}.progress-bar{width:100%;height:8px;background:#e0e3e8;border-radius:4px;overflow:hidden;margin:8px 0}.progress-fill{height:100%;background:linear-gradient(90deg,#4a90d9,#34a853);border-radius:4px;transition:width 0.5s;width:0}.pagination{display:flex;gap:3px;justify-content:center;flex-wrap:wrap;margin-top:8px}.pagination button{padding:3px 10px;font-size:11.5px;border-radius:4px}</style></head><body>
<div class="topbar"><h1>Protocol Converter</h1><div class="nav"><a href="/query">协议查询</a><a href="/decode">帧解码</a><a href="/encode">帧编码</a><a href="/parse" class="active">批量解析</a></div><div class="spacer"></div><div class="proto-sel"><select id="proto-sel" onchange="switchProto(this.value)"></select></div></div>
<div class="main">
  <div class="card"><h2>批量解析</h2><div class="row-inline"><input type="file" id="file" accept=".csv,.xlsx,.xls" style="flex:1;max-width:400px"><button class="btn-primary" onclick="upload()">上传并预览</button></div></div>
  <div class="card" id="pbox" style="display:none"><h2>预览 <span id="pinfo" style="font-size:12px;color:#888;font-weight:normal;margin-left:8px"></span></h2><div class="scroll-box"><table><thead id="phead"></thead><tbody id="pbody"></tbody></table></div><div style="margin-top:10px;display:flex;align-items:center;gap:12px"><span id="pmap" style="font-size:12px;font-weight:600"></span><button class="btn-success" id="bparse" onclick="run()">开始解析</button></div></div>
  <div class="card" id="pbar" style="display:none"><h2>解析进度</h2><div class="progress-bar"><div class="progress-fill" id="pfill"></div></div><span style="font-size:12px;color:#888" id="ptext"></span></div>
  <div class="card" id="rbox" style="display:none"><h2>解析结果 <button class="btn-primary btn-sm" style="margin-left:12px" onclick="window.open('/api/parse/export')">导出Excel</button></h2><div id="rsum" style="margin-bottom:8px;font-size:12px"></div><div class="scroll-box"><table><thead id="rhead"></thead><tbody id="rbody"></tbody></table></div><div class="pagination" id="rpag"></div></div>
</div>
<script>
const P={{protocols|tojson}},CID="{{current_id}}";let parsed=null,PG=100,pg=0;
(function(){const s=document.getElementById('proto-sel');for(const[k,v]of Object.entries(P)){const o=document.createElement('option');o.value=k;o.text=v;if(k===CID)o.selected=true;s.appendChild(o)}})();
async function switchProto(id){await fetch('/api/protocol/select',{method:'POST',body:new URLSearchParams({protocol_id:id})});location.reload()}
async function upload(){
  const f=document.getElementById('file').files[0];if(!f)return;
  const fd=new FormData();fd.append('file',f);
  const r=await(await fetch('/api/parse/upload',{method:'POST',body:fd})).json();
  if(r.error){alert(r.error);return}
  document.getElementById('pbox').style.display='';
  document.getElementById('pinfo').textContent=r.row_count+' 行 \u00b7 '+r.columns.length+' 列';
  document.getElementById('phead').innerHTML='<tr>'+r.columns.map(c=>'<th>'+c+'</th>').join('')+'</tr>';
  document.getElementById('pbody').innerHTML=r.preview.map(row=>'<tr>'+r.columns.map(c=>'<td>'+(row[c]||'')+'</td>').join('')+'</tr>').join('');
  const m=[];m.push('CAN ID: <span class="tag '+(r.id_col?'tag-green':'tag-red')+'">'+(r.id_col||'未识别')+'</span>');
  m.push('数据: <span class="tag '+(r.data_col?'tag-green':'tag-red')+'">'+(r.data_col||'未识别')+'</span>');
  document.getElementById('pmap').innerHTML=m.join(' | ');
  document.getElementById('bparse').style.display=(r.id_col&&r.data_col)?'':'none';
}
async function run(){
  document.getElementById('pbar').style.display='';document.getElementById('bparse').disabled=true;
  document.getElementById('pfill').style.width='20%';document.getElementById('ptext').textContent='解析中...';
  const r=await(await fetch('/api/parse/run',{method:'POST'})).json();
  if(r.error){alert(r.error);return}
  document.getElementById('pfill').style.width='100%';document.getElementById('ptext').textContent='完成';
  parsed=r.results;pg=0;
  document.getElementById('rbox').style.display='';showPage(0);
}
function showPage(p){
  pg=p;const s=p*PG,chunk=parsed.slice(s,s+PG);
  const cols=['CAN ID','数据域','CAN ID 解析','报文','解析结果'];
  document.getElementById('rhead').innerHTML='<tr>'+cols.map(c=>'<th>'+c+'</th>').join('')+'</tr>';
  document.getElementById('rbody').innerHTML=chunk.map(r=>'<tr>'+cols.map(c=>'<td>'+(r[c]||'')+'</td>').join('')+'</tr>').join('');
  const tot=parsed.length,mat=parsed.filter(r=>r['报文']&&r['报文']!=='UNKNOWN'&&r['报文']!=='ERROR').length,unk=parsed.filter(r=>r['报文']==='UNKNOWN').length,err=parsed.filter(r=>r['报文']==='ERROR').length;
  document.getElementById('rsum').innerHTML='<span class="tag tag-blue">共 '+tot+'</span><span class="tag tag-green">匹配 '+mat+'</span><span class="tag tag-orange">未知 '+unk+'</span><span class="tag tag-red">错误 '+err+'</span>';
  const pages=Math.ceil(tot/PG);let h='';
  for(let i=0;i<pages;i++)h+='<button style="'+(i===p?'background:#4a90d9;color:#fff':'background:#e0e3e8;color:#555')+'" onclick="showPage('+i+')">'+(i+1)+'</button>';
  document.getElementById('rpag').innerHTML=h;
}
</script></body></html>
