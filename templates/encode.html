<!DOCTYPE html><html lang="zh"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>帧编码 - Protocol Converter</title>
<style>*{box-sizing:border-box;margin:0;padding:0}body{font:13px/1.5 'Microsoft YaHei','Segoe UI',sans-serif;background:#f0f2f5;color:#2c3e50}.topbar{background:#1a1a2e;color:#e0e0e0;padding:0 16px;display:flex;align-items:center;height:44px}.topbar h1{font-size:15px;margin-right:20px;color:#fff}.nav{display:flex;gap:1px}.nav a{color:#a0aec0;text-decoration:none;padding:6px 16px;border-radius:6px 6px 0 0;font-size:12.5px}.nav a:hover,.nav a.active{color:#fff;background:rgba(255,255,255,.12);font-weight:600}.spacer{flex:1}.proto-sel select{padding:3px 8px;border-radius:4px;border:1px solid #3d4f6b;font-size:11.5px;background:#2a3a55;color:#e0e0e0}.main{padding:12px 16px;max-width:1100px;margin:0 auto}.card{background:#fff;border-radius:8px;padding:14px;box-shadow:0 1px 3px rgba(0,0,0,.06);border:1px solid #e8eaed;margin-bottom:10px}.card h2{font-size:14px;font-weight:600;color:#1a1a2e;margin-bottom:8px}table{width:100%;border-collapse:collapse;font-size:12.5px}th{background:#f5f6f8;padding:7px 10px;border-bottom:2px solid #e0e3e8;font-weight:600;color:#555;white-space:nowrap;font-size:12px;text-align:left}td{padding:6px 10px;border-bottom:1px solid #f2f3f5}tr:hover td{background:#f8f9ff}input,select,button{font-family:inherit;font-size:12.5px}input,select{border:1px solid #d0d5dd;border-radius:5px;padding:5px 8px;outline:0}input:focus{border-color:#4a90d9;box-shadow:0 0 0 3px rgba(74,144,217,.1)}input.locked{background:#f0f0f0;color:#999;border-style:dashed}button{cursor:pointer;font-weight:600;border:0;border-radius:5px;padding:6px 16px}.btn-primary{background:#4a90d9;color:#fff}.btn-primary:hover{background:#357ac0}.btn-success{background:#34a853;color:#fff}.btn-success:hover{background:#2d8f47}.btn-sm{padding:4px 10px;font-size:11.5px}.row-inline{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:8px}.mono{font-family:'Cascadia Code',Consolas,monospace;font-size:12px}.tag{display:inline-block;padding:1px 7px;border-radius:10px;font-size:11px;margin:1px 2px}.tag-green{background:#e6f4ea;color:#137333}.tag-orange{background:#fef7e0;color:#b06000}.msg-info{padding:6px 10px;border-radius:4px;font-size:12px}.msg-info.success{background:#e6f4ea;color:#137333}.msg-info.error{background:#fce8e6;color:#c5221f}.result-block{background:#f8f9fb;border-radius:6px;padding:10px;margin:6px 0;border:1px solid #e8eaed}.result-block .rl{font-size:11px;color:#888}.result-block .rv{font-weight:600;font-family:Consolas,monospace;font-size:13px}</style></head><body>
<div class="topbar"><h1>Protocol Converter</h1><div class="nav"><a href="/query">协议查询</a><a href="/decode">帧解码</a><a href="/encode" class="active">帧编码</a><a href="/parse">批量解析</a></div><div class="spacer"></div><div class="proto-sel"><select id="proto-sel" onchange="switchProto(this.value)"></select></div></div>
<div class="main">
  <div class="card"><h2>帧编码</h2>
    <div class="row-inline">
      <label>报文缩写:</label><input id="abbr" placeholder="BHM 或从查询页跳转" style="width:160px" onkeyup="if(event.key==='Enter')load()">
      <button class="btn-primary" onclick="load()">加载</button>
    </div>
  </div>
  <div class="card" id="ecard" style="display:none"><h2>编码参数 <span id="cid-display" class="mono" style="color:#4a90d9;margin-left:12px;font-size:12px"></span></h2>
    <div style="overflow:auto;max-height:500px"><table id="etbl"><thead><tr><th>字段</th><th>位置</th><th>类型</th><th>值</th></tr></thead><tbody id="ebody"></tbody></table></div>
    <div style="margin-top:10px"><button class="btn-success" onclick="build()">生成</button></div>
  </div>
  <div class="card" id="rcard" style="display:none"><h2>编码输出</h2><div id="rbody"></div><div id="tpr" style="margin-top:8px"></div></div>
</div>
<script>
const P={{protocols|tojson}},CID="{{current_id}}";
(function(){const s=document.getElementById('proto-sel');for(const[k,v]of Object.entries(P)){const o=document.createElement('option');o.value=k;o.text=v;if(k===CID)o.selected=true;s.appendChild(o)}})();
async function switchProto(id){await fetch('/api/protocol/select',{method:'POST',body:new URLSearchParams({protocol_id:id})});location.reload()}
let cur=null,fields=[];
async function load(){
  const abbr=(document.getElementById('abbr').value.trim()||new URLSearchParams(location.search).get('msg')||'').toUpperCase();
  if(!abbr)return;
  document.getElementById('abbr').value=abbr;
  const r=await(await fetch('/api/encode',{method:'POST',body:new URLSearchParams({msg_abbr:abbr})})).json();
  if(r.error){alert(r.error);return}
  cur=r;fields=r.fields;
  document.getElementById('ecard').style.display='';
  document.getElementById('cid-display').textContent='CAN ID: '+r.can_id;
  let h='';
  fields.forEach(f=>{
    const locked=!f.editable;
    h+='<tr><td class="mono">'+f.name+(f.spn?' <small style="color:#999">SPN:'+f.spn+'</small>':'')+'</td><td>'+f.byte_start+' ('+f.length+')</td><td class="mono">'+f.data_type+(f.resolution?' '+f.resolution:'')+' '+f.unit+'</td><td><input type="text" value="'+(f.default_value||'')+'" style="width:90px" data-name="'+f.name+'"'+(locked?' class="locked" readonly':'')+'></td></tr>';
  });
  document.getElementById('ebody').innerHTML=h;
}
async function build(){
  if(!cur)return;
  const vals={};document.querySelectorAll('#ebody input').forEach(i=>{vals[i.dataset.name]=parseFloat(i.value)||0});
  const fd=new FormData();fd.append('msg_abbr',document.getElementById('abbr').value.trim());fd.append('field_values',JSON.stringify(vals));
  const r=await(await fetch('/api/encode/build',{method:'POST',body:fd})).json();
  if(r.error){alert(r.error);return}
  document.getElementById('rcard').style.display='';
  document.getElementById('rbody').innerHTML='<div class="result-block"><div class="rl">CAN ID</div><div class="rv">'+r.can_id+' ('+r.can_id_hex+')</div></div><div class="result-block"><div class="rl">数据域 ('+r.data_hex.split(' ').length+' bytes)</div><div class="rv">'+r.data_hex+'</div></div>';
  document.getElementById('tpr').innerHTML=r.tp_frames&&r.tp_frames.length?'<div class="msg-info warn">TP 分包 ('+r.tp_frames.length+' 帧)</div><table><tr><th>帧</th><th>CAN ID</th><th>数据</th></tr>'+r.tp_frames.map((f,i)=>'<tr><td>'+(i+1)+'</td><td class="mono">'+f.id+'</td><td class="mono">'+f.data+'</td></tr>').join('')+'</table>':'';
}
// 从查询页跳转时自动加载
const m=new URLSearchParams(location.search).get('msg');if(m){document.getElementById('abbr').value=m.toUpperCase();load()}
</script></body></html>
